<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swagel</title>
<style>
  html, body { margin: 0; background: #fff; }
  html { overflow-x: hidden; }
  body { text-align: center; padding: calc(50vh - 1.5rem) 0 2rem; font-family: system-ui, -apple-system, sans-serif; }
  .s { font-size: 2rem; color: #000; cursor: pointer; user-select: none; margin: 0.25rem 0; }
  body.busy .s { cursor: default; }

  .walker { position: absolute; left: 0; top: 0; z-index: 10; font-size: 2rem; color: #000; white-space: nowrap; pointer-events: none; user-select: none; }
  .legs, .arms { display: none; }
  .limbs .legs, .limbs .arms { display: block; }
  .legs { position: absolute; left: 50%; top: 100%; width: 14px; height: 9px; margin-left: -7px; }
  .legs i { position: absolute; top: 0; width: 2px; height: 9px; background: #000; transform-origin: top; }
  .legs i:first-child { left: 2px; }
  .legs i:last-child { right: 2px; }
  .arms i { position: absolute; top: 55%; width: 8px; height: 2px; background: #000; }
  .arms i:first-child { right: 100%; transform-origin: right; transform: rotate(-35deg); }
  .arms i:last-child { left: 100%; transform-origin: left; transform: rotate(35deg); }
  .walking .legs i { animation: step 0.22s steps(1) infinite; }
  .walking .legs i:last-child { animation-delay: -0.11s; }
  @keyframes step { 0% { transform: rotate(24deg); } 50% { transform: rotate(-24deg); } }

  /* Tools are drawn, not emoji: a stick plus a blade. */
  .tool { position: absolute; left: calc(100% + 6px); width: 2px; background: #000; }
  .shovel { top: 62%; transform-origin: top; }
  .shovel::after { content: ''; position: absolute; left: -3px; bottom: -6px; width: 8px; height: 7px; background: #000; border-radius: 0 0 4px 4px; }
  .axe { bottom: 38%; height: 20px; transform-origin: bottom; }
  .axe::after { content: ''; position: absolute; left: 2px; top: 0; width: 8px; height: 8px; background: #000; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 60%); }
  .tool.flip { left: auto; right: calc(100% + 6px); }
  .axe.flip::after { left: auto; right: 2px; clip-path: polygon(0 0, 100% 0, 100% 60%, 0 100%); }

  .layer { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 5; pointer-events: none; }
  .br { position: absolute; line-height: 1; white-space: nowrap; color: #000; transform-origin: 0 50%; user-select: none; }
</style>
</head>
<body>
<div class="s">swagel</div>
<script>
  const PLANT = 5 + Math.floor(Math.random() * 5);   // the tree gets planted on a random click, 5–9
  const CHOP = PLANT + 5;                             // and chopped five clicks later
  const SPEED = 240;            // walking speed, px/s
  const HOME_SPEED = 300;       // a bit quicker on the way back
  const LEG = 9;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * Math.max(0, b - a);
  const pick = list => list[Math.floor(Math.random() * list.length)];
  let clicks = 0, busy = false, tree = null;

  document.body.addEventListener('click', e => {
    if (busy || !e.target.classList.contains('s')) return;
    const d = document.createElement('div');
    d.className = 's';
    d.textContent = 'swagel';
    document.body.appendChild(d);
    clicks++;
    if (clicks === PLANT || clicks === CHOP) {
      d.style.visibility = 'hidden';
      setBusy(true);
      (clicks === PLANT ? plantTree(d) : chopTree(d)).catch(console.error).finally(() => setBusy(false));
    }
  });

  function setBusy(b) {
    busy = b;
    document.body.classList.toggle('busy', b);
  }

  async function run(el, frames, opts) {
    const a = el.animate(frames, { fill: 'forwards', ...opts });
    await a.finished;
    a.commitStyles();
    a.cancel();
  }

  function makeWalker() {
    const el = document.createElement('div');
    el.className = 'walker';
    el.innerHTML = 'swagel<div class="arms"><i></i><i></i></div><div class="legs"><i></i><i></i></div>';
    document.body.appendChild(el);
    return { el, x: 0, y: 0, w: el.offsetWidth, h: el.offsetHeight, follow: true };
  }

  function place(o, x, y) {
    o.x = x; o.y = y;
    o.el.style.left = x + 'px';
    o.el.style.top = y + 'px';
  }

  function slotPos(o, slot) {
    const r = slot.getBoundingClientRect();
    return [r.left + scrollX + (r.width - o.w) / 2, r.top + scrollY];
  }

  function addTool(o, kind, height, flip) {
    const t = document.createElement('div');
    t.className = 'tool ' + kind + (flip ? ' flip' : '');
    if (height) t.style.height = height + 'px';
    o.el.appendChild(t);
    return t;
  }

  // ---- Camera: the action always stays on screen (matters on phones) ----

  const EDGE = 70;
  function keepInView(o) {
    const r = o.el.getBoundingClientRect();
    if (r.top < EDGE) scrollBy(0, r.top - EDGE);
    else if (r.bottom + LEG > innerHeight - EDGE) scrollBy(0, r.bottom + LEG - (innerHeight - EDGE));
  }

  // Smoothly scroll so the page span [top, bottom] is on screen.
  async function showSpan(top, bottom) {
    const m = 12, H = innerHeight;
    if (top >= scrollY + m && bottom <= scrollY + H - m) return;
    const target = bottom - top > H - 2 * m ? top - m : (top + bottom) / 2 - H / 2;
    const from = scrollY, to = Math.max(0, target), t0 = performance.now(), dur = 450;
    await new Promise(done => (function step(now) {
      const t = Math.min(1, (now - t0) / dur), e = t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
      scrollTo(0, from + (to - from) * e);
      t < 1 ? requestAnimationFrame(step) : done();
    })(t0));
  }

  // Constant-speed straight line; only the legs move.
  async function move(o, x, y, speed = SPEED) {
    const dist = Math.hypot(x - o.x, y - o.y);
    if (dist < 1) return;
    o.el.classList.add('walking');
    let following = o.follow;
    if (following) (function follow() { if (!following) return; keepInView(o); requestAnimationFrame(follow); })();
    await run(o.el, [{ left: o.x + 'px', top: o.y + 'px' }, { left: x + 'px', top: y + 'px' }],
      { duration: dist / speed * 1000, easing: 'linear' });
    following = false;
    o.el.classList.remove('walking');
    o.x = x; o.y = y;
  }

  // ---- Routing: swagels never overlap ----
  // Everyone travels through a lane beside the stack: sideways out of line, up/down the lane,
  // then sideways along the tree's ground line. The tree is always placed clear of both.

  let laneGap = 30;
  function laneX(o, slot, side) {
    const [x] = slotPos(o, slot);
    return x + side * (o.w + laneGap);
  }

  // Slide out of line with limbs tucked (so it can't brush the neighbours), sprout limbs in the lane.
  async function goTo(o, slot, side, x, y) {
    const lx = laneX(o, slot, side);
    await move(o, lx, o.y);
    o.el.classList.add('limbs');
    await wait(200);
    await move(o, lx, y);
    await move(o, x, y);
  }

  async function goHome(o, slot, side) {
    const [x, y] = slotPos(o, slot), lx = laneX(o, slot, side);
    await move(o, lx, o.y, HOME_SPEED);
    await move(o, lx, y, HOME_SPEED);
    o.el.classList.remove('limbs');
    await wait(150);
    await move(o, x, y, HOME_SPEED);
    await wait(100);
    slot.style.visibility = '';
    o.el.remove();
  }

  // ---- Tree generation ----

  function rng(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Fractal of swagels: each branch is a smaller swagel that forks at its tip.
  // Angles and shrink vary per fork, and the odd branch is skipped, so it grows like a real tree.
  function fractal(x, y, dir, f, ratio, { angle, shrink, min, seed, prune = 0.15 }) {
    const out = [], r = rng(seed);
    (function grow(x, y, a, f, depth) {
      if (f < min) return;
      for (const s of [-1, 1]) {
        if (depth > 1 && r() < prune) continue;
        const b = a + s * angle * (0.55 + 0.9 * r()), rad = b * Math.PI / 180, len = ratio * f;
        out.push({ x, y, a: b, f });
        grow(x + len * Math.cos(rad), y + len * Math.sin(rad), b, f * shrink * (0.85 + 0.3 * r()), depth + 1);
      }
    })(x, y, dir, f, 1);
    return out;
  }

  // Scale branches about a fixed point (the trunk top for the crown, the base for roots).
  const scaled = (list, k, oy) => list.map(b => ({ x: b.x * k, y: oy + (b.y - oy) * k, a: b.a, f: b.f * k }));

  // Every branch's two ends, with half its font size as padding.
  function ends(list, ratio) {
    return list.flatMap(b => {
      const rad = b.a * Math.PI / 180, len = ratio * b.f;
      return [[b.x, b.y, b.f / 2], [b.x + len * Math.cos(rad), b.y + len * Math.sin(rad), b.f / 2]];
    });
  }

  function box(points) {
    const bb = { l: 0, r: 0, t: 0, b: 0 };
    for (const [x, y, p] of points) {
      bb.l = Math.min(bb.l, x - p); bb.r = Math.max(bb.r, x + p);
      bb.t = Math.min(bb.t, y - p); bb.b = Math.max(bb.b, y + p);
    }
    return bb;
  }

  const union = (...bbs) => ({ l: Math.min(...bbs.map(b => b.l)), r: Math.max(...bbs.map(b => b.r)),
                               t: Math.min(...bbs.map(b => b.t)), b: Math.max(...bbs.map(b => b.b)) });

  // ---- Placement ----
  // Big screens: beside the stack, inside the current view.
  // Phones (no room beside the stack): above the stack, shrunk to fit.
  // Each layout says which side the lane is on, which side of the trunk the workers stand,
  // and which way the tree falls (always away from the stack and lane).

  function plan(o, slot, crown0, roots0, ratio) {
    const W = innerWidth, m = 12, w = o.w, h = o.h;
    const r = slot.getBoundingClientRect(), mid = r.left + r.width / 2;
    laneGap = Math.max(14, Math.min(30, W - mid - 1.5 * w - 14));
    const laneIn = s => mid + s * (w / 2 + laneGap), laneOut = s => mid + s * (w / 2 + laneGap + w);
    const reach = h / 2 + 24 + w + 10;   // where the chopper stands, measured from the trunk
    const top = scrollY, bot = scrollY + innerHeight;
    const stackTop = document.querySelector('.s').getBoundingClientRect().top + scrollY;
    const trunk = { l: -h / 2, r: h / 2, t: -w, b: 0 };

    const geom = k => {
      const crown = scaled(crown0, k, -w), roots = scaled(roots0, k, 0);
      const ce = ends(crown, ratio), all = union(box(ce), box(ends(roots, ratio)), trunk);
      // Where the crown and trunk end up after falling flat, for each direction.
      const tips = [...ce, [0, 0, h / 2], [0, -w, h / 2]];
      const fallen = F => box(tips.map(([x, y, p]) => [-F * y, F * x, p]));
      return { k, crown, roots, all, rb: box(ends(roots, ratio)), fallen };
    };
    const ks = [1, 0.85, 0.72, 0.6, 0.5, 0.42, 0.35, 0.3];

    // Beside the stack, on side s. Lane on that side; workers stand stack-side; falls outward.
    for (const k of ks) {
      const g = geom(k), options = [];
      for (const s of [-1, 1]) {
        const fb = g.fallen(s), all = union(g.all, fb);
        const x = s > 0
          ? [laneOut(1) + 8 + Math.max(-all.l, reach), W - m - all.r]
          : [m - all.l, laneOut(-1) - 8 - Math.max(all.r, reach)];
        const y = [top + m - all.t, bot - m - all.b];
        if (x[1] >= x[0] && y[1] >= y[0]) options.push({ ...g, lane: s, toward: -s, fall: s, x, y });
      }
      if (options.length) {
        const p = pick(options);
        return { ...p, cx: rand(...p.x), gy: rand(...p.y) };
      }
    }

    // Above the stack. Lane on side L; workers stand on the lane side; falls away from the lane.
    // Roots must stay out of the lane, since walkers come up it.
    let best = null;
    for (const k of ks) {
      const g = geom(k), options = [];
      for (const L of [-1, 1]) {
        // On narrow screens the tip of the falling tree may swing a little past the edge.
        const fb = g.fallen(-L), all = union(g.all, fb), tip = 0.7;
        const xb = union(g.all, { l: fb.l * tip, r: fb.r * tip, t: 0, b: 0 });
        const x = L > 0
          ? [m - xb.l, Math.min(W - m - Math.max(xb.r, reach), laneIn(1) - 8 - g.rb.r)]
          : [Math.max(m + Math.max(-xb.l, reach), laneIn(-1) + 8 - g.rb.l), W - m - xb.r];
        const y = [m - all.t, stackTop - 10 - all.b];
        if (x[1] < x[0]) continue;
        const o2 = { ...g, lane: L, toward: L, fall: -L, x, y };
        best ||= o2;
        if (y[1] >= y[0]) options.push(o2);
      }
      if (options.length) {
        const p = pick(options);
        return { ...p, cx: rand(...p.x), gy: rand(...p.y) };
      }
    }

    // Tiny screens: not enough room above the stack, so push the stack down to make some.
    const p = best || { ...geom(ks.at(-1)), lane: 1, toward: 1, fall: -1, x: [m, m], y: [0, 0] };
    const need = p.y[0] - p.y[1];
    if (need > 0) {
      const pad = parseFloat(getComputedStyle(document.body).paddingTop) + need;
      document.body.style.paddingTop = pad + 'px';
      scrollBy(0, need);
    }
    return { ...p, cx: p.x[0] + (p.x[1] - p.x[0]) / 2, gy: p.y[0] };
  }

  function drawWords(parent, list, cx, gy) {
    return list.map(b => {
      const el = document.createElement('div');
      el.className = 'br';
      el.textContent = 'swagel';
      el.style.cssText = `left:${cx + b.x}px;top:${gy + b.y - b.f / 2}px;font-size:${b.f}px;transform:rotate(${b.a}deg)`;
      parent.appendChild(el);
      return { el, d: Math.hypot(b.x, b.y) };
    });
  }

  // ---- The show ----

  async function plantTree(slot) {
    const o = makeWalker();
    place(o, ...slotPos(o, slot));
    const fs = parseFloat(getComputedStyle(o.el).fontSize), ratio = o.w / fs;

    // A new random tree every time, re-rolled until it's neither scrawny nor overgrown.
    // The crown must stay above the strip where workers walk; roots must stay below ground.
    const seed = () => Math.floor(Math.random() * 1e9), band = o.h + LEG + 8;
    let crown0, roots0, tries = 0;
    do crown0 = fractal(0, -o.w, -90, fs * rand(0.55, 0.65), ratio, { angle: rand(24, 36), shrink: rand(0.7, 0.77), min: 4.5, seed: seed(), prune: rand(0.08, 0.2) });
    while (++tries < 500 && (crown0.length < 45 || crown0.length > 110 || box(ends(crown0, ratio)).b > -band));
    tries = 0;
    do roots0 = fractal(0, 0, 90, fs * rand(0.3, 0.38), ratio, { angle: rand(30, 46), shrink: rand(0.68, 0.75), min: 3.5, seed: seed(), prune: rand(0.15, 0.3) });
    while (++tries < 500 && (roots0.length < 10 || roots0.length > 40 || roots0.some(b => b.y + ratio * b.f * Math.sin(b.a * Math.PI / 180) < b.f)));

    const p = plan(o, slot, crown0, roots0, ratio);
    const { cx, gy, lane, toward, fall, crown, roots } = p;
    place(o, ...slotPos(o, slot));   // the stack may have shifted to make room

    // Stand on the lane side of the spot, so the shovel blade lands on it.
    const digX = toward < 0 ? cx - 14 - o.w : cx + 14;
    await goTo(o, slot, lane, digX, gy - LEG - o.h);
    await showSpan(gy + p.all.t, gy + p.all.b);

    const layer = document.createElement('div');
    layer.className = 'layer';
    document.body.appendChild(layer);
    await wait(250);

    // Dig the hole: three shovel strokes.
    const shovel = addTool(o, 'shovel', gy - (o.y + o.h * 0.62) - 2, toward > 0);
    await wait(200);
    for (let i = 1; i <= 3; i++) {
      await wait(180);
      shovel.style.transform = `rotate(${toward < 0 ? -40 : 40}deg)`;
      await wait(180);
      shovel.style.transform = '';
    }
    await wait(200);
    shovel.remove();
    o.el.classList.remove('limbs');
    await wait(200);

    // Step into the hole and stand up as the trunk.
    o.el.style.transformOrigin = '0 50%';
    place(o, cx, gy - o.h / 2);
    o.el.style.transform = 'rotate(-90deg)';
    layer.appendChild(o.el);
    await wait(350);

    const crownEl = document.createElement('div');
    crownEl.className = 'layer';
    crownEl.appendChild(o.el);
    const crownWords = drawWords(crownEl, crown, cx, gy);
    const rootWords = drawWords(layer, roots, cx, gy);
    document.body.appendChild(crownEl);

    // Teardown order: crown tips inward, then the roots.
    const far = (a, b) => b.d - a.d;
    const pieces = [...crownWords.sort(far), ...rootWords.sort(far)];

    // Grow: the reverse of the teardown. Swagels are added one at a time, closest to the
    // base first, so the crown climbs and the roots spread together.
    const growth = [...crownWords, ...rootWords].sort((a, b) => a.d - b.d);
    growth.forEach(p => p.el.style.visibility = 'hidden');
    for (const p of growth) {
      p.el.style.visibility = '';
      await wait(28);
    }
    tree = { crown: crownEl, layer, pieces, cx, gy, lane, toward, fall, span: union(p.all, p.fallen(fall)), trunkH: o.h, slot };
  }

  async function chopTree(slot) {
    const { crown, layer, pieces, cx, gy, lane, toward, fall, span, trunkH, slot: plantSlot } = tree;

    const c = makeWalker();
    place(c, ...slotPos(c, slot));
    const tx = toward < 0 ? cx - trunkH / 2 - 24 - c.w : cx + trunkH / 2 + 24;
    await goTo(c, slot, lane, tx, gy - LEG - c.h);
    await showSpan(gy + span.t, gy + span.b);
    const axe = addTool(c, 'axe', 0, toward > 0);
    await wait(250);

    for (let i = 1; i <= 3; i++) {
      axe.style.transform = `rotate(${toward < 0 ? -30 : 30}deg)`;
      await wait(200);
      axe.style.transform = `rotate(${toward < 0 ? 70 : -70}deg)`;
      await wait(250);
    }
    axe.remove();

    // Timber: a slow lean, then gravity takes it flat, away from the stack.
    // Then it's removed one swagel at a time.
    crown.style.transformOrigin = `${cx}px ${gy}px`;
    await run(crown, [{ transform: 'rotate(0deg)' }, { transform: `rotate(${5 * fall}deg)` }], { duration: 700, easing: 'ease-in-out' });
    await run(crown, [{ transform: `rotate(${5 * fall}deg)` }, { transform: `rotate(${90 * fall}deg)` }], { duration: 750, easing: 'cubic-bezier(.55,0,1,.6)' });
    await wait(500);
    for (const p of pieces) {
      p.el.remove();
      await wait(16);
    }
    await wait(200);
    crown.remove();
    layer.remove();
    tree = null;

    // The trunk is lying flat where it fell; it gets up and both walk home together.
    // They share one path, with the chopper (nearer the lane) leading and the trunk a
    // step behind, so even when one walks past the other's row they never touch.
    const r = makeWalker();
    r.follow = false;   // the camera follows the leader
    place(r, fall > 0 ? cx : cx - r.w, gy - r.h / 2);
    await wait(300);
    place(r, r.x, gy - LEG - r.h);   // stands up on the ground line, same row as the chopper
    r.el.classList.add('limbs');
    await wait(250);
    await Promise.all([goHome(c, slot, lane), wait(400).then(() => goHome(r, plantSlot, lane))]);
  }
</script>
</body>
</html>
